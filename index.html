<script>
(()=>{
  const loader=document.getElementById('pageLoader');
  const scene=loader.querySelector('.loader-city');
  const fitScene=()=>{
    const width=Math.max(900,1100*window.innerWidth/window.innerHeight);
    scene.setAttribute('viewBox',[(900-width)/2,0,width,1100].join(' '));
  };
  fitScene();
  window.addEventListener('resize',fitScene);
  const loaderStarted=performance.now();
  let loaderTimer;
  const finish=(immediate=false)=>{
    if(!loader||loader.classList.contains('is-ready'))return;
    window.clearTimeout(loaderTimer);
    const remaining=immediate?0:Math.max(0,2000-(performance.now()-loaderStarted));
    loaderTimer=window.setTimeout(()=>{loader.classList.add('is-ready');loader.setAttribute('aria-hidden','true');window.setTimeout(()=>{window.removeEventListener('resize',fitScene);loader.remove()},250)},remaining);
  };
  const stylesReady=Promise.all([...document.querySelectorAll('link[data-page-style]')].map(link=>link.sheet?Promise.resolve():new Promise(resolve=>{link.addEventListener('load',resolve,{once:true});link.addEventListener('error',resolve,{once:true})})));
  document.addEventListener('DOMContentLoaded',()=>stylesReady.then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>finish()))),{once:true});
  window.setTimeout(finish,8000);
  window.addEventListener('pageshow',event=>{if(event.persisted)finish(true)});
})();
</script>
