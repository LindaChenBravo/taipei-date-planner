    <section class="type-picker" aria-label="依類型篩選">
      <label class="keyword-label" for="keyword">想找什麼？ <span>選填</span></label>
      <div class="keyword-field"><span aria-hidden="true">⌕</span><input id="keyword" type="search" placeholder="搜尋店名、餐點或關鍵字" autocomplete="off"></div>
      <div class="type-heading">類型</div>
      <div id="typeTags" class="type-tags" role="group" aria-label="選擇玩樂類型">
        <button type="button" class="type-tag active" data-type="all" aria-pressed="true">全部（<span data-total-count></span>）</button>
        <button type="button" class="type-tag" data-type="文創" aria-pressed="false">文創</button>
        <button type="button" class="type-tag" data-type="咖啡" aria-pressed="false">咖啡</button>
        <button type="button" class="type-tag" data-type="飲品" aria-pressed="false">飲品</button>
        <button type="button" class="type-tag" data-type="展覽" aria-pressed="false">展覽</button>
        <button type="button" class="type-tag" data-type="戶外" aria-pressed="false">戶外</button>
        <button type="button" class="type-tag" data-type="手作" aria-pressed="false">手作</button>
        <button type="button" class="type-tag" data-type="美食" aria-pressed="false">美食</button>
        <button type="button" class="type-tag" data-type="早餐" aria-pressed="false">早餐</button>
        <button type="button" class="type-tag" data-type="甜點" aria-pressed="false">甜點</button>
        <button type="button" class="type-tag" data-type="夜市" aria-pressed="false">夜市</button>
        <button type="button" class="type-tag" data-type="市集" aria-pressed="false">市集</button>
        <button type="button" class="type-tag" data-type="拍照" aria-pressed="false">拍照</button>
        <button type="button" class="type-tag" data-type="泡湯" aria-pressed="false">泡湯</button>
        <button type="button" class="type-tag" data-type="按摩" aria-pressed="false">按摩</button>
        <button type="button" class="type-tag" data-type="書店" aria-pressed="false">書店</button>
        <button type="button" class="type-tag" data-type="圖書館" aria-pressed="false">圖書館</button>
        <button type="button" class="type-tag" data-type="Good Eye" aria-pressed="false">Good Eye</button>
        <button type="button" class="type-tag" data-type="音樂" aria-pressed="false">音樂</button>
        <button type="button" class="type-tag" data-type="自然" aria-pressed="false">自然</button>
      </div>
    </section>

    <section class="panel list-search-controls" aria-labelledby="filterTitle">
      <h2 id="filterTitle" class="sr-only">篩選條件</h2>
      <div class="controls">
        <label for="area">想去哪一區？
          <select id="area">
            <option value="all">全部區域</option>
          </select>
        </label>
      </div>
      <p id="activeFilters" class="active-filters hidden" aria-live="polite"></p>
      <button id="randomBtn" class="random-cta" type="button"><span class="random-icon" aria-hidden="true">🎲</span><span class="random-copy"><strong>幫我找玩法</strong><small>依目前條件隨機推薦</small></span><span class="random-arrow" aria-hidden="true">↗</span></button>
    </section>

    <section id="recommendation" class="callout hidden" aria-live="polite"></section>

    <section id="routeSection" class="hidden" aria-labelledby="routeTitle">
      <div class="section-title">
        <div><h2 id="routeTitle">精選玩樂路線</h2><p class="section-copy">選一條路線，看看每站的相對位置與走訪順序。</p></div>
        <span id="routeCount" class="badge"></span>
      </div>
      <label class="route-picker" for="routeSelect"><span class="sr-only">選擇精選路線</span><select id="routeSelect"></select></label>
      <div id="routeMeta" class="route-meta" aria-live="polite"></div>
      <div class="route-map-wrap">
        <div id="routeMapCanvas" class="route-map" aria-label="所選路線的站點位置地圖"></div>
        <div class="route-map-note">虛線為走訪順序，非實際道路</div>
      </div>
      <div class="route-steps">
        <div class="route-steps-heading"><h3>依序走訪</h3><span>點站點可在地圖定位</span></div>
        <div id="routeStops"></div>
      </div>
      <div id="routeDirections" class="route-directions"></div>
      <p id="routeNote" class="note"></p>
    </section>

    <section id="mapSection" aria-labelledby="mapSectionTitle">
      <div class="section-title">
        <div><h2 id="mapSectionTitle">地圖總覽</h2><p class="section-copy">地點會跟著篩選結果更新，可直接在下方預覽。</p></div>
        <span id="mapCount" class="badge"></span>
      </div>
      <div class="map-panel">
        <div class="map-layout">
          <div class="map-frame-wrap">
            <div class="map-frame-toolbar">
              <div id="mapTypeTags" class="map-type-tags" role="group" aria-label="依類型篩選地圖景點">
                <button id="locateBtn" type="button" class="map-type-tag map-locate-tag" aria-pressed="false"><span class="tag-icon" aria-hidden="true">📍</span> <span id="locateLabel">我附近的店</span></button>
                <button type="button" class="map-type-tag active" data-type="all" aria-pressed="true"><span class="tag-icon" aria-hidden="true">✦</span>全部（<span data-total-count></span>）</button>
                <button type="button" class="map-type-tag" data-type="文創" aria-pressed="false"><span class="tag-icon" aria-hidden="true">✂️</span>文創</button>
                <button type="button" class="map-type-tag" data-type="咖啡" aria-pressed="false"><span class="tag-icon" aria-hidden="true">☕</span>咖啡</button>
                <button type="button" class="map-type-tag" data-type="飲品" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🧋</span>飲品</button>
                <button type="button" class="map-type-tag" data-type="展覽" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🖼️</span>展覽</button>
                <button type="button" class="map-type-tag" data-type="戶外" aria-pressed="false"><span class="tag-icon" aria-hidden="true">☀️</span>戶外</button>
                <button type="button" class="map-type-tag" data-type="手作" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🧵</span>手作</button>
                <button type="button" class="map-type-tag" data-type="美食" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🍽️</span>美食</button>
                <button type="button" class="map-type-tag" data-type="早餐" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🍽️</span>早餐</button>
                <button type="button" class="map-type-tag" data-type="甜點" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🍰</span>甜點</button>
                <button type="button" class="map-type-tag" data-type="夜市" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🏮</span>夜市</button>
                <button type="button" class="map-type-tag" data-type="市集" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🧺</span>市集</button>
                <button type="button" class="map-type-tag" data-type="拍照" aria-pressed="false"><span class="tag-icon" aria-hidden="true">📷</span>拍照</button>
                <button type="button" class="map-type-tag" data-type="泡湯" aria-pressed="false"><span class="tag-icon" aria-hidden="true">♨️</span>泡湯</button>
                <button type="button" class="map-type-tag" data-type="按摩" aria-pressed="false"><span class="tag-icon" aria-hidden="true">💆</span>按摩</button>
                <button type="button" class="map-type-tag" data-type="書店" aria-pressed="false"><span class="tag-icon" aria-hidden="true">📖</span>書店</button>
                <button type="button" class="map-type-tag" data-type="圖書館" aria-pressed="false"><span class="tag-icon" aria-hidden="true">📚</span>圖書館</button>
                <button type="button" class="map-type-tag" data-type="Good Eye" aria-pressed="false"><span class="tag-icon" aria-hidden="true">👁️</span>Good Eye</button>
                <button type="button" class="map-type-tag" data-type="音樂" aria-pressed="false"><span class="tag-icon" aria-hidden="true">♫</span>音樂</button>
                <button type="button" class="map-type-tag" data-type="自然" aria-pressed="false"><span class="tag-icon" aria-hidden="true">🌿</span>自然</button>
              </div>
              <p id="locationStatus" class="map-location-status hidden" role="status" aria-live="polite"></p>
              <span id="mapTitle">請選擇一個地點</span>
              <a id="mapExternalLink" class="hidden" href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">Google Maps ↗</a>
            </div>
            <div class="map-stage">
              <div id="mapCanvas" class="map-canvas" aria-label="可拖曳與縮放的台北景點地圖"></div>
              <article id="mapSpotCard" class="map-spot-card hidden" aria-live="polite"></article>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="listSection" aria-labelledby="spotTitle">
      <div class="section-title"><h2 id="spotTitle">搜尋結果</h2><div class="list-result-actions"><button id="resetBtn" class="reset-inline hidden" type="button">清除條件</button><span id="count" class="badge" aria-live="polite"></span></div></div>
      <div id="cards" class="grid"></div>
    </section>
