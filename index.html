<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="依區域、類型與時間探索台北玩樂地點，並直接查看地圖與精選路線。" />
  <title>台北玩樂地圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" />
  <style>
    :root{
      --paper:#FFFCF6; --ink:#3E3A39; --muted:#716b68;
      --coral:#F2A497; --yellow:#F6D27A; --blue:#A8D3E6; --green:#B9DAA5;
      --white:#fff; --line:3px solid var(--ink);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:"Huninn","Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink)}
    button,select,a{font:inherit}
    button,a,select{-webkit-tap-highlight-color:transparent}
    button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
    .wrap{max-width:none;margin:0;padding:0 0 44px;display:flex;flex-direction:column}
    .hero{display:grid;gap:14px;align-items:center;background:var(--yellow);border:var(--line);border-radius:32px;padding:22px 20px;margin-bottom:18px;overflow:hidden}
    .hero-copy{position:relative;z-index:1}
    .eyebrow{display:inline-block;background:var(--paper);border:var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:12px}
    h1{font-size:clamp(32px,9vw,54px);line-height:1.13;margin:0 0 10px;letter-spacing:.02em}
    h2{font-size:23px;margin:0;letter-spacing:.03em}
    .sub{color:var(--ink);margin:0;line-height:1.75;max-width:650px}
    .hero-art{min-height:190px;display:grid;place-items:center}
    .hero-art svg{width:min(100%,390px);height:auto;overflow:visible}
    .panel,.card,.route,.callout,.map-panel,.type-picker{background:var(--white);border:var(--line);border-radius:26px}
    .panel,.type-picker{padding:16px;margin-bottom:14px}
    .controls{display:grid;grid-template-columns:1fr;gap:12px}
    label{font-size:14px;font-weight:700}
    select{width:100%;margin-top:7px;padding:12px 14px;border:var(--line);border-radius:16px;background:var(--paper);color:var(--ink)}
    .buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
    .type-tags{display:flex;flex-wrap:wrap;gap:8px}
    .type-tag{padding:8px 13px;border-radius:999px;background:#fff;font-size:14px;font-weight:700}
    .type-tag.active{background:#fff;outline:3px solid var(--coral);outline-offset:2px}
    .type-picker{background:transparent;border:0;border-radius:0;padding:0;margin-bottom:14px}
    button,.button-link{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:16px;border:var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;font-weight:700;transition:transform .18s ease}
    button:hover,.button-link:hover{transform:translateY(-2px)}
    button.primary{background:var(--coral)}
    button.primary:hover{background:var(--coral)}
    .section-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:28px 0 12px}
    .section-copy{color:var(--muted);font-size:14px;margin:4px 0 0}
    .badge,.chip{display:inline-flex;align-items:center;border-radius:999px;font-size:13px}
    .badge{background:var(--yellow);border:var(--line);padding:6px 10px;white-space:nowrap;font-weight:700}
    .chip{border:2px solid var(--ink);padding:4px 9px;margin:2px 4px 0 0;background:var(--paper)}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    .card,.route{padding:18px}
    .card{display:flex;flex-direction:column;min-height:235px;position:relative;overflow:hidden}
    .card:nth-child(4n+1){background:#FFF5F1}
    .card:nth-child(4n+2){background:#FFF9E9}
    .card:nth-child(4n+3){background:#F2FAFD}
    .card:nth-child(4n+4){background:#F4FAF0}
    .card-head{display:flex;align-items:center;gap:14px;margin-bottom:9px}
    .spot-illustration{width:74px;height:74px;flex:0 0 74px;display:grid;place-items:center}
    .spot-illustration svg{width:72px;height:72px;overflow:visible}
    .card h3,.route h3{margin:0 0 6px;font-size:19px}
    .meta,.note{font-size:14px}
    .meta{font-weight:700}
    .note{color:var(--muted);line-height:1.65}
    .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:14px}
    .card-actions button,.card-actions a{padding:8px 10px;font-size:13px}
    .callout{padding:18px;margin-top:16px;background:var(--green)}
    .callout ol{margin-bottom:8px}
    .inline-map-link{color:var(--ink);font-weight:700;text-underline-offset:3px}
    #mapSection{order:-1;min-height:100svh;position:relative;margin:0 0 28px}
    #mapSection>.section-title{display:none}
    .map-panel{overflow:hidden;border:0;border-radius:0}
    .map-layout{display:grid;grid-template-columns:1fr}
    .map-frame-wrap{display:flex;flex-direction:column;min-width:0;background:var(--blue);position:relative}
    .map-frame-toolbar{position:absolute;top:14px;left:14px;right:14px;z-index:650;padding:0;background:transparent;border:0;border-radius:0;overflow:visible}
    .map-type-tags{display:flex;gap:8px;overflow-x:auto;padding:5px 5px 9px;scrollbar-width:thin;scroll-snap-type:x proximity}
    .map-type-tag{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-size:14px;font-weight:700;scroll-snap-align:start}
    .map-type-tag.active{outline:3px solid var(--coral);outline-offset:2px;background:#fff}
    .map-locate-tag[aria-pressed="true"]{outline:3px solid var(--blue);outline-offset:2px}
    .map-locate-tag:disabled{opacity:.7;cursor:wait}
    .map-location-status{display:table;max-width:min(420px,100%);margin:4px 5px 0;padding:8px 12px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);font-size:13px;font-weight:700}
    .tag-icon{font-size:16px;line-height:1;filter:saturate(.8)}
    #mapTitle{display:none;font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #mapTitle::before{content:'●';display:inline-block;color:var(--coral);font-size:20px;line-height:0;margin-right:8px;vertical-align:-1px;-webkit-text-stroke:1px var(--ink)}
    #mapExternalLink{display:none!important}
    .map-stage{position:relative;height:100svh;background:#e8eee8}
    .map-canvas{width:100%;height:100%;z-index:1;font-family:"Huninn","Noto Sans TC",sans-serif;background:#e8eee8}
    .maplibregl-canvas{cursor:grab}
    .maplibregl-canvas:active{cursor:grabbing}
    .maplibregl-ctrl-group{border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:none}
    .maplibregl-ctrl-group button{background-color:var(--paper);border:0;border-radius:0;padding:0;transform:none}
    .maplibregl-ctrl-attrib{font-family:"Huninn","Noto Sans TC",sans-serif}
    .map-marker{width:44px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;overflow:visible}
    .spot-pin{display:grid;place-items:center;width:38px;height:38px;border:3px solid var(--ink);border-radius:50% 50% 50% 12px;background:var(--coral);color:var(--ink);transform:rotate(-45deg);transition:transform .18s ease,background .18s ease;pointer-events:auto;cursor:pointer}
    .spot-pin span{font-size:20px;line-height:1;transform:rotate(45deg)}
    .spot-pin.is-active{background:var(--yellow);transform:rotate(-45deg) scale(1.18)}
    .user-location-dot{width:20px;height:20px;border:4px solid white;border-radius:50%;background:#327ac2;box-shadow:0 0 0 3px var(--ink),0 2px 8px rgba(62,58,57,.3)}
    .map-spot-card{position:absolute;left:14px;bottom:86px;z-index:500;width:min(430px,calc(100% - 28px));max-height:calc(100svh - 170px);overflow-y:auto;background:var(--paper);border:var(--line);border-radius:24px;padding:16px 52px 16px 16px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:13px;align-items:start;box-shadow:5px 6px 0 rgba(62,58,57,.16)}
    .map-card-close{position:absolute;top:11px;right:11px;width:34px;height:34px;padding:0;border:2px solid var(--ink);border-radius:50%;background:var(--white);font-size:22px;line-height:1}
    .map-spot-card .spot-illustration{width:70px;height:70px}
    .map-spot-card .spot-illustration svg{width:68px;height:68px}
    .map-spot-card h3{margin:0 0 4px;font-size:20px}
    .map-spot-card p{margin:8px 0 10px;font-size:14px;line-height:1.55;color:var(--muted)}
    .map-spot-card .spot-tags{margin:7px 0 2px}
    .map-spot-actions{display:flex;flex-wrap:wrap;gap:7px}
    .map-spot-actions button,.map-spot-actions a{font-size:12px;padding:7px 9px;border-width:2px;border-radius:12px}
    .card.map-target{outline:5px solid var(--coral);outline-offset:5px;animation:cardPop .48s ease-out}
    .route-picker{margin:12px 0 10px}
    .route-picker select{margin-top:0;background:var(--white);font-size:17px;font-weight:700}
    .route-meta{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
    .route-meta span{border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:5px 10px;font-size:13px;font-weight:700}
    .route-map-wrap{position:relative;overflow:hidden;border:var(--line);border-radius:24px;background:#e8eee8}
    .route-map{height:clamp(310px,51svh,540px);background:#e8eee8}
    .route-map-note{position:absolute;left:10px;bottom:10px;z-index:5;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:5px 8px;font-size:12px}
    .route-pin{position:absolute;display:grid;place-items:center;width:42px;height:42px;padding:0;border:3px solid var(--ink);border-radius:50%;background:var(--coral);font-size:20px;line-height:1;box-shadow:2px 3px 0 rgba(62,58,57,.18)}
    .route-pin .order{position:absolute;top:-9px;right:-9px;display:grid;place-items:center;min-width:21px;height:21px;padding:0 3px;border:2px solid var(--ink);border-radius:50%;background:var(--yellow);font-size:11px;font-weight:800}
    .route-pin.is-active{background:var(--yellow);box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink)}
    .route-steps{margin:14px 0 12px}
    .route-steps-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
    .route-steps-heading h3{margin:0;font-size:19px}
    .route-steps-heading span{font-size:12px;color:var(--muted)}
    .route-step-row{display:flex;align-items:center;border-bottom:1px solid #ded9cf}
    .route-step{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:10px 3px;border:0;border-radius:0;background:transparent;text-align:left;transform:none}
    .route-step:hover{transform:none;background:#fff9e9}
    .route-step .order{display:grid;place-items:center;flex:0 0 29px;width:29px;height:29px;border:2px solid var(--ink);border-radius:50%;background:var(--yellow);font-size:13px}
    .route-step .name{flex:1;min-width:0;font-size:15px}
    .route-step .hint{display:block;color:var(--muted);font-size:12px;font-weight:400}
    .route-step.is-active .name{color:#9a4b40}
    .route-step-link{flex:0 0 38px;display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-size:18px;text-decoration:none}
    .route-directions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .route-directions .button-link{background:var(--green)}
    .route-directions-note{width:100%;margin:0;color:var(--muted);font-size:12px}
    .hidden{display:none!important}
    .empty{grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .site-tabs{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:900;width:min(640px,calc(100% - 28px));padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:rgba(255,252,246,.94);border:var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(62,58,57,.18);backdrop-filter:blur(10px)}
    .site-tab{display:flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:14px;padding:11px 5px;background:transparent;white-space:nowrap;font-size:13px;color:var(--ink);text-decoration:none}
    .site-tab.active{background:var(--yellow);box-shadow:inset 0 0 0 2px var(--ink)}
    body.view-map .hero,body.view-map .type-picker,body.view-map .panel,body.view-map #recommendation,body.view-map #routeSection,body.view-map #listSection{display:none!important}
    body.view-map .wrap{padding-bottom:0}
    body.view-map #mapSection{margin:0;min-height:100svh}
    body.view-list #mapSection,body.view-list #routeSection{display:none!important}
    body.view-list .wrap,body.view-routes .wrap{padding:14px 14px 100px}
    body.view-routes .hero,body.view-routes .type-picker,body.view-routes .panel,body.view-routes #recommendation,body.view-routes #mapSection,body.view-routes #listSection{display:none!important}
    body.view-routes #routeSection{display:block!important;margin-top:8px}
    .hero,.type-picker,.panel,#recommendation,#routeSection,main>section[aria-labelledby="spotTitle"]{width:calc(100% - 28px);max-width:1080px;align-self:center}
    .cloud{animation:cloudDrift 4.6s ease-in-out infinite alternate}
    .gondola{animation:gondolaGlide 4.8s ease-in-out infinite alternate}
    .spark{transform-box:fill-box;transform-origin:center;animation:starSpin 8s linear infinite}
    .spot-illustration svg{animation:floaty 3s ease-in-out infinite}
    .type-tag.pop,.map-type-tag.pop{animation:pop .34s ease-out}
    @keyframes cloudDrift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
    @keyframes gondolaGlide{from{transform:translate(-26px,-5px)}to{transform:translate(42px,8px)}}
    @keyframes starSpin{to{transform:rotate(360deg)}}
    @keyframes floaty{50%{transform:translateY(-4px) rotate(1deg)}}
    @keyframes pop{50%{transform:scale(1.13)}100%{transform:scale(1)}}
    @keyframes cardPop{50%{transform:scale(1.025)}100%{transform:scale(1)}}
    @media(min-width:720px){
      .hero{grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);padding:30px 34px}
      .controls{grid-template-columns:repeat(2,1fr)}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .map-frame-toolbar{left:22px;right:22px;padding:0}
      .site-tab{font-size:15px;padding:11px 10px}
    }
    @media(max-width:420px){
      .map-spot-card{grid-template-columns:54px minmax(0,1fr);gap:9px;padding:13px 48px 13px 13px}
      .map-spot-card .spot-illustration,.map-spot-card .spot-illustration svg{width:52px;height:52px}
      .map-spot-card h3{font-size:18px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body class="view-map">
  <main class="wrap">
    <header class="hero">
      <div class="hero-copy">
        <div class="eyebrow">Taipei Fun Map · Four Ways</div>
        <h1>台北玩樂<br>地圖</h1>
        <p class="sub">依區域、類型與時間，探索台北好玩的地點。選好景點後，可直接預覽位置或開啟 Google Maps 導航。</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 390 250" role="img">
          <g fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="318" cy="49" r="30" fill="#F2A497"/>
            <g class="cloud" fill="#FFFCF6">
              <path d="M276 104c2-11 17-15 24-6 7-12 27-6 26 8 12-1 17 16 3 19h-50c-15-2-15-20-3-21Z"/>
              <path d="M32 140c1-8 9-12 16-10 4-9 19-10 25-2 10-2 16 5 16 11 8-1 13 5 13 12 0 7-5 11-13 11H43c-9 0-14-5-14-11 0-5 1-8 3-11Z"/>
            </g>
            <path d="M-4 27c55 3 110 12 166 28"/>
            <path d="M18 205c40-48 78-44 112 0 42-65 90-70 135 0 34-39 68-36 107 0v28H18Z" fill="#B9DAA5"/>
            <g class="gondola">
              <path d="M76 43v23M65 41h22"/>
              <circle cx="76" cy="42" r="4" fill="#3E3A39"/>
              <path d="M42 65h68c9 0 14 7 14 16v23c0 10-6 15-16 15H44c-10 0-16-5-16-15V81c0-9 5-16 14-16Z" fill="#F2A497"/>
              <path d="M40 77h28v20H40Zm44 0h28v20H84Z" fill="#A8D3E6"/>
              <path d="M76 66v52M35 105h82"/>
            </g>
            <g transform="translate(162 35)">
              <path d="M35 0v31"/>
              <path d="M25 31h20v8H25Z" fill="#A8D3E6"/>
              <path d="M16 39h38l-4 16H20Z" fill="#A8D3E6"/>
              <path d="M15 55h40l-4 16H19Z" fill="#A8D3E6"/>
              <path d="M14 71h42l-4 16H18Z" fill="#A8D3E6"/>
              <path d="M13 87h44l-4 16H17Z" fill="#A8D3E6"/>
              <path d="M12 103h46l-4 16H16Z" fill="#A8D3E6"/>
              <path d="M11 119h48l-4 16H15Z" fill="#A8D3E6"/>
              <path d="M10 135h50l-4 16H14Z" fill="#A8D3E6"/>
              <path d="M9 151h52l-4 16H13Z" fill="#A8D3E6"/>
              <path d="M14 167h42l11 38H3Z" fill="#A8D3E6"/>
              <path d="M35 44v7M35 60v7M35 76v7M35 92v7M35 108v7M35 124v7M35 140v7M35 156v7M35 176v18" stroke-width="3"/>
              <circle cx="35" cy="170" r="4" fill="#A8D3E6"/>
              <path d="M-4 205h78" stroke-width="5"/>
            </g>
            <path class="spark" d="m341 139 4 8 8 4-8 4-4 8-4-8-8-4 8-4Z" fill="#F6D27A"/>
          </g>
        </svg>
      </div>
    </header>

    <section class="type-picker" aria-label="依類型篩選">
      <div id="typeTags" class="type-tags" role="group" aria-label="選擇玩樂類型">
        <button type="button" class="type-tag active" data-type="all" aria-pressed="true">全部（<span data-total-count></span>）</button>
        <button type="button" class="type-tag" data-type="文創" aria-pressed="false">文創</button>
        <button type="button" class="type-tag" data-type="咖啡" aria-pressed="false">咖啡</button>
        <button type="button" class="type-tag" data-type="飲品" aria-pressed="false">飲品</button>
        <button type="button" class="type-tag" data-type="展覽" aria-pressed="false">展覽</button>
        <button type="button" class="type-tag" data-type="戶外" aria-pressed="false">戶外</button>
        <button type="button" class="type-tag" data-type="手作" aria-pressed="false">手作</button>
        <button type="button" class="type-tag" data-type="美食" aria-pressed="false">美食</button>
        <button type="button" class="type-tag" data-type="早餐" aria-pressed="false">早餐</button>
        <button type="button" class="type-tag" data-type="甜點" aria-pressed="false">甜點</button>
        <button type="button" class="type-tag" data-type="夜市" aria-pressed="false">夜市</button>
        <button type="button" class="type-tag" data-type="市集" aria-pressed="false">市集</button>
        <button type="button" class="type-tag" data-type="拍照" aria-pressed="false">拍照</button>
        <button type="button" class="type-tag" data-type="泡湯" aria-pressed="false">泡湯</button>
        <button type="button" class="type-tag" data-type="按摩" aria-pressed="false">按摩</button>
        <button type="button" class="type-tag" data-type="書店" aria-pressed="false">書店</button>
        <button type="button" class="type-tag" data-type="圖書館" aria-pressed="false">圖書館</button>
        <button type="button" class="type-tag" data-type="Good Eye" aria-pressed="false">Good Eye</button>
        <button type="button" class="type-tag" data-type="音樂" aria-pressed="false">音樂</button>
        <button type="button" class="type-tag" data-type="自然" aria-pressed="false">自然</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="filterTitle">
      <h2 id="filterTitle" class="sr-only">篩選條件</h2>
      <div class="controls">
        <label for="area">想去哪一區？
          <select id="area">
            <option value="all">全部區域</option>
            <option>中山／赤峰街</option><option>中山／松江南京</option><option>永康街／東門</option><option>華山／忠孝新生</option>
            <option>圓山</option><option>松山</option><option>信義</option><option>東區／大安</option>
            <option>台電大樓</option><option>大稻埕</option><option>北投</option><option>北投／關渡</option>
            <option>三重</option><option>南港</option><option>板橋</option><option>永和</option><option>東北角</option>
          </select>
        </label>
        <label for="duration">可用時間

const foodTypes=['美食','早餐'];
function spotVisualType(spot){
  if(spot.type.includes('飲品'))return '飲品';
  if(spot.type.includes('圖書館'))return '圖書館';
  if(spot.type[0]==='書店')return '書店';
  if(spot.type.includes('咖啡'))return '咖啡';
  if(spot.type.includes('甜點'))return '甜點';
  if(spot.type.includes('書店'))return '書店';
  if(spot.type.includes('泡湯'))return '泡湯';
  if(spot.type.includes('按摩'))return '按摩';
  if(spot.type.includes('夜市')&&/夜市|市場|市集/.test(spot.name))return '夜市';
  if(spot.type.includes('市集'))return '市集';
  if(foodTypes.some(type=>spot.type.includes(type)))return '美食';
  return ['咖啡','音樂','自然','戶外','拍照','展覽','手作','文創','夜市'].find(type=>spot.type.includes(type))||'文創';
}

function spotMarkerIcon(spot){
  return typeIcons[spotVisualType(spot)]||'📍';
}

function initVectorMap(){
  if(!window.maplibregl){
    els.mapCanvas.innerHTML='<p class="empty">互動地圖載入失敗，請檢查網路連線後重新整理。</p>';
    return;
  }
  vectorMap=new maplibregl.Map({
    container:els.mapCanvas,
    style:'https://tiles.openfreemap.org/styles/positron',
    center:[121.545,25.052],
    zoom:11,
    attributionControl:true,
    localIdeographFontFamily:'"Huninn","Noto Sans TC",sans-serif'
  });
  vectorMap.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
}

function updateMarkerSelection(){
  markerByName.forEach((entry,name)=>{
    entry.element.querySelector('.spot-pin')?.classList.toggle('is-active',currentMapSpot?.name===name);
  });
}

function updateMapSpotCard(spot){
  const chips=spot.type.map(tag=>`<span class="chip">${tag}</span>`).join('');
  const sourceLink=spot.guideUrl?`<a class="button-link" href="${spot.guideUrl}" target="_blank" rel="noopener noreferrer">Good Eye 介紹 ↗</a>`:spot.reviewUrl?`<a class="button-link" href="${spot.reviewUrl}" target="_blank" rel="noopener noreferrer">推薦依據 ↗</a>`:spot.sourceUrl?`<a class="button-link" href="${spot.sourceUrl}" target="_blank" rel="noopener noreferrer">推薦貼文 ↗</a>`:'';
  els.mapSpotCard.innerHTML=`<button type="button" class="map-card-close" aria-label="關閉地點圖卡">×</button><div class="spot-illustration">${spotIllustration(spot)}</div><div><h3>${spot.name}</h3><div class="meta">${spotMeta(spot)}</div><div class="spot-tags">${chips}</div><p>${spot.note}</p><div class="map-spot-actions"><a class="button-link" href="${spotMapLink(spot)}" target="_blank" rel="noopener noreferrer">在 Google Maps 開啟 ↗</a>${sourceLink}</div></div>`;
  els.mapSpotCard.classList.remove('hidden');
}

function closeMapSpotCard(){
  const previous=currentMapSpot;
  currentMapSpot=null;
  els.mapSpotCard.classList.add('hidden');
  els.mapTitle.textContent='選擇一個景點';
  els.mapExternalLink.classList.add('hidden');
  updateMarkerSelection();
  markerByName.get(previous?.name)?.element.focus({preventScroll:true});
}

els.mapSpotCard.addEventListener('click',event=>{
  if(event.target.closest('.map-card-close'))closeMapSpotCard();
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!els.mapSpotCard.classList.contains('hidden'))closeMapSpotCard();
});

function setView(view){
  const isMap=view==='map';
  const isList=view==='list';
  const isRoutes=view==='routes';
  document.body.classList.toggle('view-map',isMap);
  document.body.classList.toggle('view-list',isList);
  document.body.classList.toggle('view-routes',isRoutes);
  els.routeSection.classList.toggle('hidden',!isRoutes);
  els.siteTabs.forEach(tab=>{
    const active=tab.dataset.view===view;
    tab.classList.toggle('active',active);
    tab.setAttribute('aria-pressed',String(active));
  });
  window.scrollTo({top:0,behavior:scrollBehavior()});
  if(isMap&&vectorMap)window.setTimeout(()=>vectorMap.resize(),0);
  if(isRoutes){
    ensureRouteMap();
    window.setTimeout(()=>{if(routeMap){routeMap.resize();fitRouteMap()}},0);
  }
}

function openInMap(spot,scroll=true,pan=true){
  if(scroll)setView('map');
  currentMapSpot=spot;
  els.mapTitle.textContent=spot.name;
  els.mapExternalLink.href=spotMapLink(spot);
  els.mapExternalLink.classList.remove('hidden');
  updateMapSpotCard(spot);
  updateMarkerSelection();
  const position=spot.coords||spotCoordinates[spot.name];
  if(vectorMap&&position&&pan){
    vectorMap.easeTo({center:[position[1],position[0]],zoom:Math.max(vectorMap.getZoom(),14),duration:scrollBehavior()==='smooth'?650:0});
  }
  if(scroll) els.mapSection.scrollIntoView({behavior:scrollBehavior(),block:'start'});
}

function scrollToSpotCard(){
  if(!currentMapSpot)return;
  const index=spots.indexOf(currentMapSpot);
  const card=document.getElementById(`spot-card-${index}`);
  if(!card)return;
  document.querySelectorAll('.card.map-target').forEach(item=>item.classList.remove('map-target'));
  card.scrollIntoView({behavior:scrollBehavior(),block:'center'});
  card.classList.add('map-target');
  card.focus({preventScroll:true});
  window.setTimeout(()=>card.classList.remove('map-target'),1300);
}

function renderMapList(list){
  markerByName.forEach(entry=>entry.marker.remove());
  markerByName.clear();
  els.mapCount.textContent=`${list.length} 個地點`;
  currentMapSpot=null;
  els.mapSpotCard.classList.add('hidden');
  els.mapTitle.textContent='選擇一個景點';
  els.mapExternalLink.classList.add('hidden');
  list.forEach(spot=>{
    const position=spot.coords||spotCoordinates[spot.name];
    if(vectorMap&&position){
      const element=document.createElement('button');
      element.type='button'; element.className='map-marker'; element.title=spot.name; element.setAttribute('aria-label',spot.name);
      element.innerHTML=`<span class="spot-pin"><span aria-hidden="true">${spotMarkerIcon(spot)}</span></span>`;
      element.addEventListener('click',()=>openInMap(spot,false,true));
      const marker=new maplibregl.Marker({element,anchor:'bottom'}).setLngLat([position[1],position[0]]).addTo(vectorMap);
      markerByName.set(spot.name,{marker,element});
    }
  });
  if(userLocation&&vectorMap){
    vectorMap.easeTo({center:[userLocation.lng,userLocation.lat],zoom:13,duration:scrollBehavior()==='smooth'?650:0});
    window.setTimeout(()=>vectorMap.resize(),0);
    return;
  }
  if(!list.length){
    els.mapTitle.textContent='沒有可顯示的地點';
    els.mapSpotCard.classList.add('hidden');
    els.mapExternalLink.href='https://www.google.com/maps';
    if(vectorMap)vectorMap.jumpTo({center:[121.545,25.052],zoom:11});
  }else{
    if(vectorMap){
      const bounds=list.map(spot=>spot.coords||spotCoordinates[spot.name]).filter(Boolean);
      if(bounds.length===1)vectorMap.jumpTo({center:[bounds[0][1],bounds[0][0]],zoom:14});
      else if(bounds.length>1){
        const mapBounds=bounds.reduce((acc,point)=>acc.extend([point[1],point[0]]),new maplibregl.LngLatBounds());
        vectorMap.fitBounds(mapBounds,{padding:60,maxZoom:13,duration:scrollBehavior()==='smooth'?650:0});
      }
      window.setTimeout(()=>vectorMap.resize(),0);
    }
  }
}

function render(list){
  els.cards.replaceChildren();
  els.count.textContent=`${list.length} 個地點`;
  if(!list.length){els.cards.innerHTML='<div class="card empty">目前沒有符合條件的地點，試著放寬時間或類型。</div>';renderMapList(list);return;}
  list.forEach(spot=>{
    const card=document.createElement('article'); card.className='card';
    card.id=`spot-card-${spots.indexOf(spot)}`; card.tabIndex=-1;
    const chips=spot.type.map(tag=>`<span class="chip">${tag}</span>`).join('');
    card.innerHTML=`<div class="card-head"><div class="spot-illustration">${spotIllustration(spot)}</div><div><h3>${spot.name}</h3><div class="meta">${spotMeta(spot)}</div></div></div><p class="note">${spot.note}</p><div>${chips}</div>`;
    const actions=document.createElement('div'); actions.className='card-actions';
    const preview=document.createElement('button'); preview.type='button'; preview.textContent='地圖預覽';
    preview.addEventListener('click',()=>openInMap(spot));
    const external=document.createElement('a'); external.className='button-link'; external.textContent='Google Maps ↗';
    external.href=spotMapLink(spot); external.target='_blank'; external.rel='noopener noreferrer';
    actions.append(preview,external); card.appendChild(actions); els.cards.appendChild(card);
    if(spot.guideUrl||spot.reviewUrl||spot.sourceUrl){
      const source=document.createElement('a');source.className='button-link';source.textContent=spot.guideUrl?'Good Eye 介紹 ↗':spot.reviewUrl?'推薦依據 ↗':'推薦貼文 ↗';
      source.href=spot.guideUrl||spot.reviewUrl||spot.sourceUrl;source.target='_blank';source.rel='noopener noreferrer';actions.appendChild(source);
    }
  });
  renderMapList(list);
}

function renderRoutes(){
  els.routeCount.textContent=`${routes.length} 條`;
  routes.forEach((route,index)=>els.routeSelect.add(new Option(route.name,String(index))));
  els.routeSelect.addEventListener('change',()=>renderRoute(Number(els.routeSelect.value)));
  renderRoute(0);
}

function routeStopIcon(name){
  if(/書店/.test(name))return '📖';
  if(/碼頭/.test(name))return '⛵';
  if(/夜市/.test(name))return '🏮';
  if(/咖啡/.test(name))return '☕';
  if(/晚餐/.test(name))return '🍽️';
  if(/站|車站/.test(name))return '🚉';
  if(/花市/.test(name))return '🌼';
  if(/博物館|美術館|電影|表演藝術|中山堂/.test(name))return '🖼️';
  if(/公園|山|步道|橋|地熱谷/.test(name))return '🌿';
  return '📍';
}

function routeDirectionsUrl(names){
  const positions=names.map(name=>routeLocations[name]);
  const params=new URLSearchParams({api:'1',origin:positions[0].join(','),destination:positions.at(-1).join(','),travelmode:'walking'});
  if(positions.length>2)params.set('waypoints',positions.slice(1,-1).map(position=>position.join(',')).join('|'));
  return `https://www.google.com/maps/dir/?${params}`;
}

function renderRouteDirections(route){
  els.routeDirections.replaceChildren();
  for(let start=0,part=1;start<route.stops.length-1;start+=4,part++){
    const names=route.stops.slice(start,start+5);
    const link=document.createElement('a');
    link.className='button-link';
    link.href=routeDirectionsUrl(names);link.target='_blank';link.rel='noopener noreferrer';
    link.textContent=route.stops.length<=5?'在 Google Maps 看路程 ↗':`第 ${part} 段（${start+1}–${start+names.length} 站）↗`;
    els.routeDirections.appendChild(link);
  }
  if(route.stops.length>5||route.stops.some(name=>routeStopDetails[name]?.hint)){
    const note=document.createElement('p');note.className='route-directions-note';
    note.textContent=[
      route.stops.length>5?'手機瀏覽器的多站路線分段開啟；兩段在共用站點銜接。':'',
      route.stops.some(name=>routeStopDetails[name]?.hint)?'標示為示意的街區或活動站點，導航只會帶到參考位置。':''
    ].filter(Boolean).join(' ');
    els.routeDirections.appendChild(note);
  }
}

function renderRoute(index){
  selectedRouteIndex=index;
  selectedRouteStop=-1;
  const route=routes[index];
  els.routeSelect.value=String(index);
  const kind=/跑步|縱走|福州山/.test(route.name)?'🌿 戶外路線':/文化路徑/.test(route.name)?'🏛️ 文化散步':'🚶 散步路線';
  els.routeMeta.innerHTML=`<span>📍 ${route.stops.length} 站</span><span>${kind}</span>`;
  els.routeMapCanvas.setAttribute('aria-label',`${route.name}的站點位置地圖`);
  els.routeStops.replaceChildren();
  route.stops.forEach((name,stopIndex)=>{
    const row=document.createElement('div');row.className='route-step-row';
    const button=document.createElement('button');button.type='button';button.className='route-step';
    button.setAttribute('aria-label',`在地圖定位第 ${stopIndex+1} 站：${name}`);
    const number=document.createElement('span');number.className='order';number.textContent=stopIndex+1;
    const label=document.createElement('span');label.className='name';label.textContent=name;
    const hint=routeStopDetails[name]?.hint;
    if(hint){const small=document.createElement('small');small.className='hint';small.textContent=hint;label.appendChild(small)}
    button.append(number,label);button.addEventListener('click',()=>focusRouteStop(stopIndex));
    const link=document.createElement('a');link.className='route-step-link';link.textContent='↗';
    link.setAttribute('aria-label',`在 Google Maps 開啟${name}`);
    link.href=mapLink(routeStopDetails[name]?.query||name,route.area||'台北');
    link.target='_blank';link.rel='noopener noreferrer';
    row.append(button,link);els.routeStops.appendChild(row);
  });
  renderRouteDirections(route);
  const trail=/跑步|縱走|福州山/.test(route.name)?' 戶外步道請依現場指標；Google Maps 步行路程僅供參考。':'';
  els.routeNote.textContent=route.note+trail;
  updateRouteMap();
}

function focusRouteStop(index){
  selectedRouteStop=index;
  els.routeStops.querySelectorAll('.route-step').forEach((button,buttonIndex)=>{
    const active=buttonIndex===index;
    button.classList.toggle('is-active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  routeMarkers.forEach((entry,markerIndex)=>entry.element.classList.toggle('is-active',markerIndex===index));
  const position=routeLocations[routes[selectedRouteIndex].stops[index]];
  if(routeMap&&position)routeMap.easeTo({center:[position[1],position[0]],duration:scrollBehavior()==='smooth'?500:0});
}

function fitRouteMap(){
  if(!routeMap)return;
  const positions=routes[selectedRouteIndex].stops.map(name=>routeLocations[name]);
  const bounds=positions.reduce((box,position)=>box.extend([position[1],position[0]]),new maplibregl.LngLatBounds());
  routeMap.fitBounds(bounds,{padding:55,maxZoom:14.5,duration:0});
}

function updateRouteMap(){
  if(!routeMap||!routeMap.getSource('route-order'))return;
  routeMarkers.forEach(entry=>entry.marker.remove());routeMarkers.length=0;
  const route=routes[selectedRouteIndex];
  const coordinates=route.stops.map(name=>{const point=routeLocations[name];return [point[1],point[0]]});
  routeMap.getSource('route-order').setData({type:'Feature',geometry:{type:'LineString',coordinates}});
  route.stops.forEach((name,index)=>{
    const element=document.createElement('button');element.type='button';element.className='route-pin';
    element.setAttribute('aria-label',`第 ${index+1} 站：${name}`);
    element.innerHTML=`<span aria-hidden="true">${routeStopIcon(name)}</span><span class="order" aria-hidden="true">${index+1}</span>`;
    element.addEventListener('click',()=>focusRouteStop(index));
    const marker=new maplibregl.Marker({element,anchor:'center'}).setLngLat(coordinates[index]).addTo(routeMap);
    routeMarkers.push({marker,element});
  });
  routeMap.resize();fitRouteMap();
}

function ensureRouteMap(){
  if(routeMap)return;
  if(!window.maplibregl){els.routeMapCanvas.innerHTML='<p class="empty">地圖暫時無法載入；仍可使用下方站點與 Google Maps 連結。</p>';return}
  routeMap=new maplibregl.Map({
    container:els.routeMapCanvas,
    style:'https://tiles.openfreemap.org/styles/positron',
    center:[121.52,25.05],zoom:12,attributionControl:true,
    localIdeographFontFamily:'"Huninn","Noto Sans TC",sans-serif'
  });
  routeMap.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
  routeMap.on('load',()=>{
    routeMap.addSource('route-order',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
    routeMap.addLayer({id:'route-order-line',type:'line',source:'route-order',paint:{'line-color':'#3E3A39','line-width':3,'line-dasharray':[1.5,2.5]}});
    updateRouteMap();
  });
}

function distanceKm(spot){
  const position=spot.coords||spotCoordinates[spot.name];
  if(!userLocation||!position)return Infinity;
  const radians=Math.PI/180;
  const deltaLat=(position[0]-userLocation.lat)*radians;
  const deltaLng=(position[1]-userLocation.lng)*radians;
  const a=Math.sin(deltaLat/2)**2+Math.cos(userLocation.lat*radians)*Math.cos(position[0]*radians)*Math.sin(deltaLng/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function spotMeta(spot){
  const distance=userLocation?distanceKm(spot):Infinity;
  return `${spot.area}・約 ${spot.hours} 小時${Number.isFinite(distance)?`・距離 ${distance.toFixed(1)} 公里`:''}`;
}

function filtered(){
  const area=els.area.value,type=selectedType,duration=els.duration.value;
  const matches=spots.filter(spot=>(userLocation||area==='all'||spot.area===area)&&(type==='all'||spot.type.includes(type))&&(userLocation||duration==='all'||spot.hours<=Number(duration)));
  return userLocation?matches.filter(spot=>distanceKm(spot)<=nearbyRadiusKm).sort((a,b)=>distanceKm(a)-distanceKm(b)):matches;
}

function setLocationStatus(message){
  els.locationStatus.textContent=message;
  els.locationStatus.classList.toggle('hidden',!message);
}

function clearLocation(){
  locationRequestId++;
  userLocation=null;
  userMarker?.remove();
  userMarker=null;
  els.locateBtn.disabled=false;
  els.locateBtn.setAttribute('aria-pressed','false');
  els.locateLabel.textContent='我附近的店';
  setLocationStatus('');
}

function updateNearbyStatus(){
  if(!userLocation)return;
  const count=filtered().length;
  setLocationStatus(count?`已顯示 5 公里內 ${count} 個地點，按「取消定位」可回到完整地圖。`:'5 公里內沒有符合類型的地點，可以試試「全部」或取消定位。');
}

function clearHighlights(){els.recommendation.classList.add('hidden');els.routeSection.classList.add('hidden')}

function selectType(type,button){
  selectedType=type;
  button.classList.remove('pop'); void button.offsetWidth; button.classList.add('pop');
  window.setTimeout(()=>button.classList.remove('pop'),360);
  document.querySelectorAll('[data-type]').forEach(tag=>{
    const active=tag.dataset.type===type; tag.classList.toggle('active',active); tag.setAttribute('aria-pressed',String(active));
  });
  clearHighlights(); render(filtered()); updateNearbyStatus();
}

els.filterBtn.addEventListener('click',()=>{clearHighlights();render(filtered())});
els.typeTags.addEventListener('click',event=>{
  const button=event.target.closest('.type-tag');
  if(!button)return;
  selectType(button.dataset.type,button);
});
els.mapTypeTags.addEventListener('click',event=>{
  const button=event.target.closest('.map-type-tag[data-type]');
  if(!button)return;
  selectType(button.dataset.type,button);
});
els.locateBtn.addEventListener('click',()=>{
  if(userLocation){
    clearLocation();
    render(filtered());
    return;
  }
  if(!navigator.geolocation){
    setLocationStatus('這個瀏覽器不支援定位，請使用裝置上的瀏覽器開啟網站。');
    return;
  }
  const requestId=++locationRequestId;
  els.locateBtn.disabled=true;
  els.locateLabel.textContent='定位中…';
  setLocationStatus('正在取得你的位置…');
  navigator.geolocation.getCurrentPosition(position=>{
    if(requestId!==locationRequestId)return;
    const {latitude:lat,longitude:lng}=position.coords;
    if(!Number.isFinite(lat)||!Number.isFinite(lng)){
      els.locateBtn.disabled=false;
      els.locateLabel.textContent='我附近的店';
      setLocationStatus('無法讀取位置，請再試一次。');
      return;
    }
    userLocation={lat,lng};
    els.locateBtn.disabled=false;
    els.locateBtn.setAttribute('aria-pressed','true');
    els.locateLabel.textContent='取消定位';
    if(vectorMap){
      const dot=document.createElement('div');
      dot.className='user-location-dot';
      dot.title='你的位置';
      dot.setAttribute('aria-label','你的位置');
      userMarker=new maplibregl.Marker({element:dot,anchor:'center'}).setLngLat([lng,lat]).addTo(vectorMap);
    }
    render(filtered());
    updateNearbyStatus();
  },error=>{
    if(requestId!==locationRequestId)return;
    els.locateBtn.disabled=false;
    els.locateLabel.textContent='我附近的店';
    setLocationStatus(error.code===1?'無法取得位置，請在瀏覽器允許此網站使用定位後再試。':'定位失敗，請確認裝置定位已開啟後重試。');
  },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
});
els.resetBtn.addEventListener('click',()=>{
  clearLocation();
  els.area.value=els.duration.value='all'; selectedType='all';
  document.querySelectorAll('[data-type]').forEach(tag=>{
    const active=tag.dataset.type==='all'; tag.classList.toggle('active',active); tag.setAttribute('aria-pressed',String(active));
  });
  clearHighlights(); render(spots);
});
els.mapBtn.addEventListener('click',()=>setView('map'));
els.siteTabs.forEach(tab=>tab.addEventListener('click',()=>setView(tab.dataset.view)));
els.randomBtn.addEventListener('click',()=>{
  const pool=filtered();
  if(!pool.length){els.recommendation.textContent='目前沒有符合條件的地點。';els.recommendation.classList.remove('hidden');return;}
  const grouped={}; pool.forEach(spot=>(grouped[spot.area]??=[]).push(spot));
  const areas=Object.keys(grouped),chosen=areas[Math.floor(Math.random()*areas.length)];
  const picks=[...grouped[chosen]].sort(()=>Math.random()-.5).slice(0,3);
  const items=picks.map(spot=>`<li><a class="inline-map-link" href="${spotMapLink(spot)}" target="_blank" rel="noopener noreferrer">${spot.name} ↗</a></li>`).join('');
  els.recommendation.innerHTML=`<strong>今日推薦：${chosen}</strong><ol>${items}</ol><div class="note">市集、展覽與營業資訊可能變動，出發前請再確認。</div>`;
  els.recommendation.classList.remove('hidden'); render(grouped[chosen]);
});

renderRoutes();
initVectorMap();
render(spots);
</script>
</body>
</html>
